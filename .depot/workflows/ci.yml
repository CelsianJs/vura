# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: CI
on:
  pull_request:
  push:
    branches: [main, audit-hardening]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assert:release-private
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm verify:publish
      # The npm registry retired the legacy audit endpoint used by pnpm 10.
      # audit:all intentionally uses pnpm 11, whose runtime floor is Node 22.
      - run: pnpm audit:all
        if: matrix.node-version == 22
  # Self-host audit runs as a separate job parallel to verify.
  # Rationale: scaffoldAndBuild() packs all workspace packages, runs npm install
  # inside a tmpdir, and runs vura build — roughly 2–4 min on a cold runner.
  # Running this in the verify matrix would double its wall-clock time for every
  # Node version. A single Node-22 job is sufficient: the suite is testing runtime
  # correctness (no platform calls, ws, cron logic), not Node version compat.
  selfhost-audit:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:selfhost-audit
