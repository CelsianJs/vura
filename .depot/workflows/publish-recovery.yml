name: Recover tagged publication
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag whose payload must remain unchanged
        required: true
        type: string
      release_commit:
        description: Full immutable commit SHA resolved by the release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: recover-tagged-publication
  cancel-in-progress: false
jobs:
  recover:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify immutable release payload
        env:
          VURA_RELEASE_TAG: ${{ inputs.release_tag }}
          VURA_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: node scripts/assert-release-payload.mjs
      - run: pnpm install --frozen-lockfile
      - name: Run complete credential-free release gate
        run: pnpm release:check
      - name: Recheck payload and publish not-yet-published packages
        env:
          VURA_RELEASE_TAG: ${{ inputs.release_tag }}
          VURA_RELEASE_COMMIT: ${{ inputs.release_commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/assert-release-payload.mjs
          node scripts/publish-packages.mjs
      - run: pnpm verify:registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovered-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: warn
