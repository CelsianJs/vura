# Depot CI Migration
# Source: .github/workflows/release.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Release JS packages
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm assert:release-private
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # The npm registry retired the legacy audit endpoint used by pnpm 10.
      # audit:all intentionally uses pnpm 11, whose runtime floor is Node 22.
      - run: pnpm audit:all
        if: matrix.node-version == 22
      - run: pnpm verify:publish
      - run: pnpm package:size
      - uses: actions/upload-artifact@v7
        with:
          name: package-sizes-node-${{ matrix.node-version }}
          path: artifacts/package-sizes.json
          if-no-files-found: error
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm verify:publish
      - run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm verify:registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vura-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: error
