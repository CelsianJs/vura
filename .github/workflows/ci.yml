name: CI

# Runs on Depot CI (.depot/workflows/) as of 2026-07-11 (Kirby's directive).
# This copy keeps workflow_dispatch as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assert:release-private
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm verify:publish
      # Package sizes are a ledger, not a suggestion, but this gate lived only in
      # release.yml. Three limits drifted past their real values between 0.8.0 and
      # now, and nothing went red until release time, by which point the growth was
      # spread across several merged PRs and nobody could say which one spent it.
      # Run it here so the PR that adds the bytes is the PR that raises the number.
      # One Node version is enough: the tarballs are byte-identical on 20 and 22.
      - run: pnpm package:size
        if: matrix.node-version == 22
      # The npm registry retired the legacy audit endpoint used by pnpm 10.
      # audit:all intentionally uses pnpm 11, whose runtime floor is Node 22.
      - run: pnpm audit:all
        if: matrix.node-version == 22

  # Self-host audit runs as a separate job parallel to verify.
  # Rationale: scaffoldAndBuild() packs all workspace packages, runs npm install
  # inside a tmpdir, and runs vura build — roughly 2–4 min on a cold runner.
  # Running this in the verify matrix would double its wall-clock time for every
  # Node version. A single Node-22 job is sufficient: the suite is testing runtime
  # correctness (no platform calls, ws, cron logic), not Node version compat.
  selfhost-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:selfhost-audit
