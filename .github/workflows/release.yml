name: Release JS packages

# Releases are tag-driven (v*) on GitHub-hosted runners, which are free for a
# public repo. From 2026-07-11 to 2026-10-25 they ran on Depot CI
# (.depot/workflows/release.yml), which is paid and could not attach npm
# provenance. This publisher attaches provenance (the publish script gates it
# on NPM_PROVENANCE and the GitHub OIDC env). workflow_dispatch against a tag
# stays as the manual fallback.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm assert:release-private
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # The npm registry retired the legacy audit endpoint used by pnpm 10.
      # audit:all intentionally uses pnpm 11, whose runtime floor is Node 22.
      - run: pnpm audit:all
        if: matrix.node-version == 22
      - run: pnpm verify:publish
      - run: pnpm package:size
      - uses: actions/upload-artifact@v7
        with:
          name: package-sizes-node-${{ matrix.node-version }}
          path: artifacts/package-sizes.json
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm verify:publish
      - run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is explicit opt-in: only this GitHub-hosted publisher has
          # a Sigstore-accepted OIDC identity (Depot emulates the GHA env but
          # its identity token is rejected with a 400).
          NPM_PROVENANCE: '1'
      - run: pnpm verify:registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vura-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: error
