name: Release JS packages

# Releases run on Depot CI (.depot/workflows/release.yml) as of 2026-07-11 —
# Kirby's call: all-Depot, accepting that npm provenance (GHA-OIDC-only) is
# dropped. This copy keeps workflow_dispatch as a fallback publisher; if run
# here it still attaches provenance (publish script gates on the OIDC env).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm assert:release-private
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit:all
      - run: pnpm verify:publish
      - run: pnpm package:size
      - uses: actions/upload-artifact@v7
        with:
          name: package-sizes-node-${{ matrix.node-version }}
          path: artifacts/package-sizes.json
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm verify:publish
      - run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is explicit opt-in: only this GitHub-hosted publisher has
          # a Sigstore-accepted OIDC identity (Depot emulates the GHA env but
          # its identity token is rejected with a 400).
          NPM_PROVENANCE: '1'
      - run: pnpm verify:registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vura-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: error
