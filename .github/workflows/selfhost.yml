name: Self-host guides

# One workflow, seven jobs, each mirroring its guide's commands.
# The shared 'scaffold' job builds the workspace, packs local tarballs,
# scaffolds an app against today's code, and uploads it as an artifact.
# Every target job downloads that artifact — so they all test the same
# local packages, not npm latest.

# Runs on Depot CI (.depot/workflows/) as of 2026-07-11 (Kirby's directive).
# This copy keeps workflow_dispatch as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # scaffold: builds workspace, packs tarballs, scaffolds app, builds it.
  # ──────────────────────────────────────────────────────────────────────
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Scaffold app against local packages
        # cd /tmp so create-vura creates /tmp/app (project name becomes the dir).
        # link-local-packages puts tarballs in /tmp/app/.selfhost-tarballs/ by
        # default (inside the app) so file: refs are relative and survive
        # artifact download on a different runner.
        run: |
          cd /tmp && node "$GITHUB_WORKSPACE/packages/create-vura/dist/index.js" app --no-install
          # The template has no server-mode page, so nothing in this matrix
          # would exercise per-request rendering or a loader without it.
          node "$GITHUB_WORKSPACE/scripts/add-page-fixture.mjs" /tmp/app
          node "$GITHUB_WORKSPACE/scripts/link-local-packages.mjs" /tmp/app

      - name: Install scaffold dependencies
        run: |
          cd /tmp/app
          npm install --no-audit --no-fund

      - name: Build scaffold app
        run: |
          cd /tmp/app
          npm run build

      - name: Assert build output shape
        run: |
          test -f /tmp/app/dist/server/entry.js
          test -d /tmp/app/dist/static
          # The server-mode page fixture must have been bundled for the hot
          # server; a build that quietly skips it is the class of defect this
          # workflow exists to catch.
          test -f /tmp/app/dist/server/pages/posts.js
          # Dockerfile and fly.toml are emitted by vura build when hot routes
          # are present (the default scaffold has /api/chat and /api/health).
          # template.yaml is only emitted when the lambda adapter is configured
          # — it is NOT present in the base scaffold build.
          test -f /tmp/app/dist/Dockerfile
          test -f /tmp/app/dist/fly.toml

      - name: Upload scaffold artifact (without node_modules)
        uses: actions/upload-artifact@v7
        with:
          name: scaffold-app
          # Exclude node_modules — each consumer job installs what it needs.
          # Tarballs are in .selfhost-tarballs/ and are included.
          path: |
            /tmp/app
            !/tmp/app/**/node_modules/**
          include-hidden-files: true

  # ──────────────────────────────────────────────────────────────────────
  # node-vps: mirrors the node-vps guide — prod server boots, serves a
  # static page, an API route, and accepts a WebSocket upgrade.
  # Does NOT test systemd or Caddy — those require a real Linux host.
  # ──────────────────────────────────────────────────────────────────────
  node-vps:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # checkout needed for scripts/assert-served-pages.mjs
      - uses: actions/download-artifact@v8
        with:
          name: scaffold-app
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dist dependencies (ws for WebSocket)
        run: |
          cd app/dist
          npm install --no-audit --no-fund

      - name: Boot production server and smoke
        run: |
          cd app
          PORT=3000 NODE_ENV=production node dist/server/entry.js &
          npx --yes wait-on -t 30000 http://localhost:3000
          # Every page mode, the API and the 404 — the same script every other
          # target runs, so no leg's coverage can drift from another's.
          node "$GITHUB_WORKSPACE/scripts/assert-served-pages.mjs" http://localhost:3000
          # WebSocket: /api/chat sends a Welcome message on connect.
          # A single 'message' event from the Welcome line is sufficient
          # proof of upgrade (matches the guide smoke test).
          # Run from dist/ so Node finds the ws package installed there.
          cd dist && node --input-type=module -e '
            const { WebSocket } = await import("ws");
            const ws = new WebSocket("ws://localhost:3000/api/chat");
            ws.on("message", (data) => {
              const text = data.toString();
              if (!text.startsWith("Welcome")) { console.error("unexpected WS message:", text); process.exit(1); }
              console.log("WS OK:", text.substring(0, 60));
              process.exit(0);
            });
            ws.on("error", (e) => { console.error("WS error:", e.message); process.exit(1); });
            setTimeout(() => { console.error("no WS message within 5s"); process.exit(1); }, 5000);
          '

  # ──────────────────────────────────────────────────────────────────────
  # docker: mirrors the docker guide — builds the image using the guide's
  # exact Dockerfile (extracted from the guide markdown), runs the
  # container, curls the smoke surface.
  # Does NOT test Docker Compose or healthcheck config.
  # ──────────────────────────────────────────────────────────────────────
  docker:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # checkout needed for the guide markdown source

      - uses: actions/download-artifact@v8
        with:
          name: scaffold-app
          path: app

      - name: Extract Dockerfile from guide and build image
        # The guide says: docker build -f dist/Dockerfile dist
        # We extract the Dockerfile into dist/ and build with dist/ as context.
        run: |
          node scripts/extract-guide-dockerfile.mjs \
            docs-site/pages/self-host/docker.md \
            > app/dist/Dockerfile
          docker build -t vura-selfhost-test app/dist

      - name: Run container and smoke
        run: |
          docker run -d -p 3000:3000 --name vura-app vura-selfhost-test
          npx --yes wait-on -t 30000 http://localhost:3000
          node scripts/assert-served-pages.mjs http://localhost:3000
          docker logs vura-app

  # ──────────────────────────────────────────────────────────────────────
  # fly: validates the fly.toml from the guide with flyctl, then boots
  # the same Docker image locally to confirm the smoke surface serves.
  # Does NOT deploy to Fly — no cloud credentials in CI.
  # ──────────────────────────────────────────────────────────────────────
  fly:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: scaffold-app
          path: app

      - name: Validate guide fly.toml structure
        # flyctl config validate hits the Fly API (requires auth).
        # Instead: extract the fly.toml and verify required fields are
        # present with a simple Node.js check — no credentials needed.
        # This still proves the guide's fly.toml is well-formed and matches
        # what vura build emits.
        run: |
          node scripts/extract-guide-block.mjs \
            docs-site/pages/self-host/fly.md toml \
            > app/fly.toml
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const toml = readFileSync("app/fly.toml", "utf8");
            const required = ["app =", "kill_signal =", "kill_timeout =", "[http_service]", "internal_port =", "auto_stop_machines ="];
            for (const key of required) {
              if (!toml.includes(key)) { console.error("fly.toml missing required field:", key); process.exit(1); }
            }
            console.log("fly.toml structure OK — required fields present");
          '

      - name: Build the Docker image Fly would run
        run: |
          node scripts/extract-guide-dockerfile.mjs \
            docs-site/pages/self-host/docker.md \
            > app/dist/Dockerfile
          docker build -t vura-fly-test app/dist

      - name: Run image locally and smoke
        run: |
          docker run -d -p 8080:3000 vura-fly-test
          npx --yes wait-on -t 30000 http://localhost:8080
          node scripts/assert-served-pages.mjs http://localhost:8080

  # ──────────────────────────────────────────────────────────────────────
  # railway: mirrors the railway guide. dist/ is the deploy root `railway up`
  # uploads, so this leg checks that every path the guide's railway.json names
  # resolves there, then runs the image the way Railway runs it: startCommand
  # replacing the image CMD, and an injected PORT that is NOT the Dockerfile's
  # ENV default.
  # Does NOT touch Railway. No account, no project, no credentials. The CLI
  # upload and its .gitignore filtering, Railway's builder and registry, the
  # *.railway.app domain and its TLS, and Railway's own healthcheck and
  # app-sleep machinery are out of scope — the guide says so too.
  # ──────────────────────────────────────────────────────────────────────
  railway:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: scaffold-app
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guide Dockerfile must be the one vura build emits
        # Every other Docker-based leg overwrites dist/Dockerfile with the
        # guide's copy, so a guide showing a Dockerfile the build no longer
        # writes would still go green. Compare before overwriting anything.
        run: |
          node scripts/extract-guide-dockerfile.mjs \
            docs-site/pages/self-host/railway.md \
            > /tmp/railway-guide.Dockerfile
          diff /tmp/railway-guide.Dockerfile app/dist/Dockerfile

      - name: Validate the guide's railway.json against the deploy root
        # Railway builds with the root of the uploaded source as the Docker
        # context; it does not move the context to the Dockerfile's directory.
        # Running `railway up` from inside dist/ makes dist/ that root, so
        # every path railway.json names must resolve there. The guide used to
        # point dockerfilePath at dist/Dockerfile and startCommand at
        # server/entry.js from the PROJECT root: that image builds, exits 0,
        # and then crash-loops on Cannot find module '/app/server/entry.js'.
        run: |
          node scripts/extract-guide-block.mjs \
            docs-site/pages/self-host/railway.md json \
            > app/dist/railway.json
          node scripts/assert-railway-config.mjs app/dist/railway.json app/dist

      - name: Build the image Railway would build
        run: docker build -t vura-railway-test -f app/dist/Dockerfile app/dist

      - name: Start it the way Railway starts it, then smoke
        run: |
          START_CMD=$(node -p "require('./app/dist/railway.json').deploy.startCommand")
          HEALTH=$(node -p "require('./app/dist/railway.json').deploy.healthcheckPath")
          # PORT is injected at runtime and deliberately NOT the Dockerfile's
          # ENV default: an app that ignores it keeps answering on 3000 and
          # Railway's router sees nothing. startCommand replaces the image CMD
          # the same way Railway's deploy.startCommand does.
          docker run -d --name vura-railway-app -e PORT=8080 -p 8080:8080 \
            vura-railway-test sh -c "exec $START_CMD"
          npx --yes wait-on -t 30000 "http://localhost:8080$HEALTH"
          # Railway marks the deploy failed if healthcheckPath is not 200.
          curl -fsS -o /dev/null -w "healthcheck %{url_effective} -> %{http_code}\n" \
            "http://localhost:8080$HEALTH"
          # A green healthcheck is not a served app. An image whose static
          # output is missing answers healthcheckPath with 200 and every page
          # with 404 — the same script every other leg runs, for that reason.
          node scripts/assert-served-pages.mjs http://localhost:8080
          # Hot routes are why this guide claims all route kinds. ws is
          # installed inside the image, so ask from in there.
          docker exec vura-railway-app node --input-type=module -e '
            const { WebSocket } = await import("ws");
            const ws = new WebSocket(`ws://127.0.0.1:${process.env.PORT}/api/chat`);
            ws.on("message", (data) => {
              const text = data.toString();
              if (!text.startsWith("Welcome")) { console.error("unexpected WS message:", text); process.exit(1); }
              console.log("WS OK:", text.substring(0, 60));
              process.exit(0);
            });
            ws.on("error", (e) => { console.error("WS error:", e.message); process.exit(1); });
            setTimeout(() => { console.error("no WS message within 5s"); process.exit(1); }, 5000);
          '
          docker logs vura-railway-app

  # ──────────────────────────────────────────────────────────────────────
  # cloudflare: builds with the Cloudflare adapter, runs wrangler dev
  # (workerd, local emulation), curls /api/hello and the static page.
  # Does NOT deploy to Cloudflare — no credentials in CI; edge behavior
  # is out of scope.
  # ──────────────────────────────────────────────────────────────────────
  cloudflare:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # checkout needed for scripts/use-adapter.mjs

      - uses: actions/download-artifact@v8
        with:
          name: scaffold-app
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Switch to Cloudflare adapter and install
        run: |
          node scripts/use-adapter.mjs app cloudflare
          cd app
          npm install --no-audit --no-fund

      - name: Build with Cloudflare adapter
        run: |
          cd app
          npm run build 2>&1 | tee /tmp/cf-build.log
          # Hot routes are expected to be excluded (adapter warns but succeeds)
          test -f dist/cloudflare/wrangler.toml
          test -f dist/cloudflare/entry.js
          # Pages, not just the API. dist/cloudflare/ carried neither of these
          # until the adapter learned to emit them, and the build still exited 0.
          test -f dist/cloudflare/pages.js
          test -f dist/cloudflare/assets/index.html
          grep -q '^\[assets\]' dist/cloudflare/wrangler.toml

      - name: Smoke under wrangler dev (workerd local)
        run: |
          cd app/dist/cloudflare
          npx --yes wrangler dev --local --port 8787 &
          # Use TCP wait — wrangler is ready when the port is open, regardless
          # of HTTP status code on the root path.
          npx --yes wait-on -t 60000 tcp:localhost:8787
          # This step curled /api/hello and nothing else, which is how the
          # Worker shipped for months serving 404 for every page.
          node "$GITHUB_WORKSPACE/scripts/assert-served-pages.mjs" http://localhost:8787

  # ──────────────────────────────────────────────────────────────────────
  # lambda: builds with the Lambda adapter, validates template.yaml with
  # sam validate --lint, then curls /api/hello under sam local start-api
  # (Docker-backed Lambda emulation).
  # Does NOT deploy to AWS — no credentials in CI; API Gateway and IAM
  # behavior are out of scope.
  # ──────────────────────────────────────────────────────────────────────
  lambda:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: scaffold-app
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Switch to Lambda adapter and install
        run: |
          node scripts/use-adapter.mjs app lambda
          cd app
          npm install --no-audit --no-fund

      - name: Build with Lambda adapter
        run: |
          cd app
          npm run build 2>&1 | tee /tmp/lambda-build.log
          # Hot routes are expected to be excluded (adapter warns but succeeds)
          test -f dist/template.yaml
          # The pages function and its routes. The template declared neither,
          # so API Gateway answered 403 for '/' while the build reported success.
          test -f dist/lambda/__pages/index.js
          test -f dist/lambda/__pages/assets/index.html
          grep -q 'VuraPagesFunction' dist/template.yaml

      - name: Validate SAM template
        run: |
          cd app
          sam validate --template dist/template.yaml --lint

      - name: Smoke under sam local start-api
        run: |
          cd app
          sam local start-api \
            --template dist/template.yaml \
            --port 3001 \
            &
          # sam local raises KeyError on HEAD requests (wait-on default) —
          # use TCP wait until the port opens, then curl with GET.
          # Generous timeout: sam local may pull a Docker image on first run.
          npx --yes wait-on -t 120000 tcp:localhost:3001
          # Retry curl a few times to allow sam local to fully initialise
          for i in 1 2 3 4 5; do
            result=$(curl -s http://localhost:3001/api/hello)
            echo "$result"
            echo "$result" | grep -q '"message"' && break
            sleep 2
          done
          # Then the pages, which this leg never asked for.
          node "$GITHUB_WORKSPACE/scripts/assert-served-pages.mjs" http://localhost:3001
