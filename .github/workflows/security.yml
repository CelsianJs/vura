name: Security scanning

# Runs on GitHub-hosted runners: free for this public repository, and public
# repositories never use ZVN's self-hosted runners (a fork pull request could
# run code on them). Depot CI was retired for this workflow on 2026-10-19.
# The secret scan runs on every pull request and push to main. CodeQL runs
# weekly and on demand only, as before.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      # CodeQL upload requires GitHub Advanced Security on this repository. Keep
      # this non-blocking until GHAS/code scanning is enabled.
      - uses: github/codeql-action/analyze@v4
        continue-on-error: true

  secrets:
    name: Secret scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks CLI
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --redact --verbose
