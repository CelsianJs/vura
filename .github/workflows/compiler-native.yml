name: Build @celsian/vura-compiler-native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/compiler-native/**'
      - '.github/workflows/compiler-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/compiler-native/**'
      - '.github/workflows/compiler-native.yml'

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Built on ARM runners, not cross-compiled. See the Zig note below.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Same-arch glibc host to musl target is still a cross. The v3 CLI
          # flag for that is --cross-compile, not --use-napi-cross (glibc only).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            napi_flags: --cross-compile
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # pnpm is needed on EVERY leg, not just the one that runs the JS tests,
      # because the build below resolves the napi CLI from the package's own
      # devDependencies. Gating these to one target left the other six with
      # `pnpm: command not found`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      # Filtered, so six extra legs do not each pay for a full workspace
      # install. This package's devDependencies are all the build needs.
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --filter @celsian/vura-compiler-native

      - name: Install JavaScript test dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # x86_64-musl still builds with the distro musl-gcc. aarch64-musl does
      # not: see the zig / --cross-compile steps below.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # aarch64-unknown-linux-gnu stays native on the ARM runner. rustc emits
      # `--fix-cortex-a53-843419` for that target (it is part of the spec, not
      # a flag anyone set). Older zig linkers rejected it, which is why this
      # row left `napi build --zig` on an x86_64 runner.

      # aarch64-unknown-linux-musl is a cross even on the ARM runner (glibc
      # host, musl target). With no cross flag the v3 CLI sets the linker to
      # `aarch64-linux-musl-gcc`, which then drives the host `/usr/bin/ld`.
      # That ld cannot find `libgcc_s.so.1`, which a musl sysroot does not
      # ship. `--use-napi-cross` is Linux glibc only and errors on musl. The
      # v3 musl path is `--cross-compile`, which routes through cargo-zigbuild.
      # cargo-zigbuild 0.23+ strips the cortex-a53 arg that older zig rejected.
      # The CLI also appends `-C target-feature=-crt-static` for any musl
      # target, so the addon stays dlopen-able by a musl Node.
      - uses: mlugg/setup-zig@v2
        if: matrix.target == 'aarch64-unknown-linux-musl'
        with:
          version: 0.15.2

      # Prebuilt binary. The CLI would `cargo install` this on first use, which
      # compiles it from source and adds minutes to the only failing leg.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      # Use the CLI from the package's own devDependencies, never a global pin.
      # A globally installed @napi-rs/cli@2.18.4 sat here while the crate moved
      # to napi 3, and a v2 CLI cannot generate glue for napi 3 code: every
      # target failed with `unresolved import crate::ScanResult` and
      # `cannot find type WatcherHandle`, which reads like a source error and is
      # not one. Resolving the CLI from the workspace makes the two versions
      # impossible to drift apart.
      - name: Build native addon
        working-directory: packages/compiler-native
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.napi_flags }}

      - name: Verify native scanner parity
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm test:compiler-native

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/compiler-native/*.node
          if-no-files-found: error

  # Publish job (only on main branch push with version bump)
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages/compiler-native/artifacts

      - name: Collect artifacts
        working-directory: packages/compiler-native
        run: |
          set -euo pipefail
          find artifacts -maxdepth 3 -type f -name '*.node' -print -exec cp {} . \;
          count=$(find . -maxdepth 1 -type f -name '*.node' | wc -l | tr -d ' ')
          if [ "$count" != "7" ]; then
            echo "Expected 7 native artifacts, found $count" >&2
            find artifacts -maxdepth 3 -type f -print >&2
            exit 1
          fi

      - name: List artifacts
        working-directory: packages/compiler-native
        run: ls -la *.node

      # Uncomment to enable publishing:
      # - name: Publish
      #   working-directory: packages/compiler-native
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
