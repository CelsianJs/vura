name: Build @then/compiler-native

on:
  push:
    branches: [main]
    paths:
      - 'packages/compiler-native/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/compiler-native/**'

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Zig for Linux ARM cross-linking
        if: startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: mlugg/setup-zig@v2

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli@2.18.4

      - name: Build native addon
        if: ${{ !startsWith(matrix.target, 'aarch64-unknown-linux') }}
        working-directory: packages/compiler-native
        run: napi build --platform --release --target ${{ matrix.target }}

      - name: Build native addon with Zig linker
        if: startsWith(matrix.target, 'aarch64-unknown-linux')
        working-directory: packages/compiler-native
        run: napi build --platform --release --target ${{ matrix.target }} --zig

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/compiler-native/*.node
          if-no-files-found: error

  # Publish job (only on main branch push with version bump)
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages/compiler-native/artifacts

      - name: Move artifacts
        working-directory: packages/compiler-native
        run: |
          npm install -g @napi-rs/cli@2.18.4
          napi artifacts

      - name: List artifacts
        working-directory: packages/compiler-native
        run: ls -la *.node 2>/dev/null || echo "No .node files yet"

      # Uncomment to enable publishing:
      # - name: Publish
      #   working-directory: packages/compiler-native
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
