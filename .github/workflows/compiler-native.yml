name: Build @celsian/vura-compiler-native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/compiler-native/**'
      - '.github/workflows/compiler-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/compiler-native/**'
      - '.github/workflows/compiler-native.yml'

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Built on ARM runners, not cross-compiled. See the Zig note below.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # pnpm is needed on EVERY leg, not just the one that runs the JS tests,
      # because the build below resolves the napi CLI from the package's own
      # devDependencies. Gating these to one target left the other six with
      # `pnpm: command not found`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      # Filtered, so six extra legs do not each pay for a full workspace
      # install. This package's devDependencies are all the build needs.
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --filter @celsian/vura-compiler-native

      - name: Install JavaScript test dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # No Zig, and no cross-linking, for the two aarch64-linux targets.
      #
      # They used `napi build --zig`, which cross-linked from an x86_64 runner.
      # rustc emits `--fix-cortex-a53-843419` for aarch64-unknown-linux-gnu (the
      # erratum workaround is part of the target spec, not a flag anyone set),
      # Zig's linker rejects the argument outright, and the build died with
      # "unsupported linker arg". Nothing in this repo could turn that off: the
      # flag comes from the target definition.
      #
      # GitHub's ARM runners build both targets natively, so the linker in
      # question never runs. Same toolchain as every other row in this matrix.

      # Use the CLI from the package's own devDependencies, never a global pin.
      # A globally installed @napi-rs/cli@2.18.4 sat here while the crate moved
      # to napi 3, and a v2 CLI cannot generate glue for napi 3 code: every
      # target failed with `unresolved import crate::ScanResult` and
      # `cannot find type WatcherHandle`, which reads like a source error and is
      # not one. Resolving the CLI from the workspace makes the two versions
      # impossible to drift apart.
      # musl needs rustc's self-contained linking objects. The napi 3 CLI picks
      # `<arch>-linux-musl-gcc` as the linker driver, which then looks for the
      # system `libgcc_s.so.1` that a musl sysroot does not ship, and the
      # aarch64 leg died with "cannot find libgcc_s.so.1". `link-self-contained`
      # makes rustc supply its own, which is what the napi 2 CLI effectively did
      # for us before. Scoped to musl so the other five targets are untouched.
      - name: Build native addon
        working-directory: packages/compiler-native
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static -C link-self-contained=yes' || '' }}
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }}

      - name: Verify native scanner parity
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm test:compiler-native

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/compiler-native/*.node
          if-no-files-found: error

  # Publish job (only on main branch push with version bump)
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages/compiler-native/artifacts

      - name: Collect artifacts
        working-directory: packages/compiler-native
        run: |
          set -euo pipefail
          find artifacts -maxdepth 3 -type f -name '*.node' -print -exec cp {} . \;
          count=$(find . -maxdepth 1 -type f -name '*.node' | wc -l | tr -d ' ')
          if [ "$count" != "7" ]; then
            echo "Expected 7 native artifacts, found $count" >&2
            find artifacts -maxdepth 3 -type f -print >&2
            exit 1
          fi

      - name: List artifacts
        working-directory: packages/compiler-native
        run: ls -la *.node

      # Uncomment to enable publishing:
      # - name: Publish
      #   working-directory: packages/compiler-native
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
