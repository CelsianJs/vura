[package]
name = "vura-compiler-native"
version = "0.2.0"
edition = "2021"
description = "Native Rust compiler for Vura — route scanning, JSX transforms, and file watching"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
napi = { version = "3", features = ["napi4", "serde-json"] }
napi-derive = "3"
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.143"
swc_ecma_parser = "24"
swc_ecma_ast = "29"
swc_common = { version = "14", features = ["sourcemap"] }
notify = { version = "6", features = ["macos_kqueue"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
opt-level = 3
